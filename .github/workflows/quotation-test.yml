name: Quotation browser and PDF smoke test
on:
  push:
    branches: [feature/universal-quotation-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  quotation-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:quotation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quotation-smoke-pdf
          path: test-artifacts/quotation-smoke.pdf
          if-no-files-found: ignore
