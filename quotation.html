<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEKTACT | Universal Quotation</title>
<style>
:root{font-family:"Trebuchet MS",Arial,sans-serif;color:#171b22}*{box-sizing:border-box}body{margin:0;background:#e9edf3}.toolbar{background:#102c52;color:white;padding:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}.toolbar button,.toolbar a{background:white;color:#102c52;border:0;border-radius:5px;padding:10px 14px;font-weight:bold;cursor:pointer;text-decoration:none}.hint{font-size:12px;color:#e5edf7}.sheet{background:white;max-width:794px;min-height:1123px;margin:25px auto;padding:48px 45px 30px;box-shadow:0 5px 24px #0002;font-size:13px;line-height:1.45}.head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.head .details{flex:1}.logo{width:112px;height:105px;object-fit:contain}h1{font-size:16px;margin:0 0 12px}label{display:block;font-size:11px;font-weight:bold;margin:8px 0 2px}input,textarea,select{font:inherit;border:1px solid #d7dce3;border-radius:3px;padding:5px;width:100%;background:white}textarea{resize:vertical;min-height:55px}.date{max-width:170px}hr{border:0;border-top:1px solid #222;margin:19px 0 13px}h2{font-size:14px;margin:0 0 8px}.rows{width:100%;border-collapse:collapse;margin-top:14px}.rows th{font-size:12px;text-align:left;border-bottom:1px solid #bbb;padding:7px 5px}.rows td{vertical-align:top;padding:7px 4px;border-bottom:1px solid #eee}.rows input,.rows textarea{min-width:0}.rows .desc{min-width:170px}.rows .n{width:65px}.rows .qty{width:80px}.rows .rate{width:85px}.rows .amt{text-align:right;white-space:nowrap;font-weight:bold}.totals{display:flex;justify-content:flex-end;margin-top:24px}.totals strong{font-size:16px}.words{margin-top:22px}.terms{margin-top:34px}.footer{border-top:1px solid #222;margin-top:30px;padding-top:12px;font-size:12px}.actions{margin:12px 0;display:flex;gap:8px}.actions button{padding:7px 10px;border:1px solid #9da9bb;background:#fff;cursor:pointer}.muted{color:#596779}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.line-item-remove{background:#fff;border:1px solid #aaa;cursor:pointer}.print-only{display:none}@page{size:A4;margin:12mm}@media print{body{background:white} .sheet input,.sheet textarea{white-space:pre-wrap;overflow:visible}.toolbar,.actions,.line-item-remove,.no-print{display:none!important}.sheet{margin:0;padding:0;box-shadow:none;max-width:none;min-height:0}input,textarea,select{border:0;padding:0;appearance:none;resize:none;overflow:visible}textarea{field-sizing:content}.rows tr{break-inside:avoid}.footer{break-inside:avoid}.print-only{display:block}}@media(max-width:650px){.sheet{margin:8px;padding:18px;min-height:0}.rows{font-size:11px}.rows .desc{min-width:100px}.head{gap:8px}.logo{width:75px;height:75px}}
</style></head><body>
<div class="toolbar"><div><b>TEKTACT Universal Quotation</b><div class="hint">Customer PDF only — internal costs and profit are never shown.</div></div><div><a href="index.html">Painting calculator</a> <button type="button" id="print">Print / Save PDF</button></div></div>
<main class="sheet"><div class="head"><div class="details"><label for="date">Date</label><input class="date" id="date" type="date"><label for="contractor">Contractor</label><input id="contractor" value="Tektact Consultants & Contractors"><label for="client">Client company and address</label><textarea id="client" placeholder="Company name and complete address"></textarea><label for="attention">Kind Attention</label><input id="attention" placeholder="Contact person's name"></div><img class="logo" src="logo%201%202026.jpeg" alt="TEKTACT logo"></div>
<hr><label for="service">Service</label><select id="service"><option>Painting</option><option>Waterproofing</option><option>Epoxy Flooring</option><option>Decorative Textures</option><option>Wallpaper</option><option>Specialty Flooring</option><option>Renovation</option><option>Other</option></select><label for="scope">Scope</label><textarea id="scope" placeholder="Scope of work"></textarea><label for="highlights">Highlights of our application</label><textarea id="highlights" placeholder="System benefits, surface preparation and application methodology"></textarea><hr>
<h2>Description of specification</h2><table class="rows"><thead><tr><th>No.</th><th>Description</th><th>Unit</th><th>Qty</th><th>Rate (₹)</th><th>Amount (₹)</th><th class="no-print"></th></tr></thead><tbody id="items"></tbody></table><div class="actions"><button type="button" id="add">+ Add item</button></div>
<div class="totals"><div><b>Net Amount: ₹ <span id="net">0.00</span></b></div></div><div class="words"><b>Amount in words:</b><div id="words">Rupees Zero Only.</div></div>
<hr><h2>Terms & Conditions</h2><textarea id="terms" rows="7">1. Taxes extra, if applicable.
2. Final billing will be based on jointly verified measurements and approved variations.
3. Payment terms: To be agreed before commencement.
4. Quotation validity: 10 days from quotation date.
5. Electricity, water and secure storage space: Client's scope unless otherwise agreed.</textarea>
<div class="footer"><b>Registered Office</b><div><textarea id="office" aria-label="Company address" rows="2" placeholder="Enter verified TEKTACT office address"></textarea></div><div><input id="contact" aria-label="Company contact details" placeholder="Enter verified phone, website and email"></div></div></main>
<script>
const $=id=>document.getElementById(id), money=n=>new Intl.NumberFormat('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
$('date').value=new Date().toLocaleDateString('en-CA');
function spell(n){n=Math.floor(n);if(n===0)return 'Zero';const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];function small(x){return x>=100?ones[Math.floor(x/100)]+' Hundred'+(x%100?' '+small(x%100):''):x>=20?tens[Math.floor(x/10)]+(x%10?' '+ones[x%10]:''):ones[x]}let out=[];for(const [v,name] of [[10000000,'Crore'],[100000,'Lakh'],[1000,'Thousand']]){if(n>=v){out.push(small(Math.floor(n/v))+' '+name);n%=v}}if(n)out.push(small(n));return out.join(' ')}
function recalc(){let total=0;[...$('items').rows].forEach((row,i)=>{row.querySelector('.serial').textContent=i+1;const qty=Number(row.querySelector('.qty').value),rate=Number(row.querySelector('.rate').value);const amount=Number.isFinite(qty*rate)&&qty>=0&&rate>=0?qty*rate:0;row.querySelector('.amt').textContent=money(amount);total+=amount});total=Math.round(total*100)/100;$('net').textContent=money(total);const rupees=Math.floor(total),paise=Math.round((total-rupees)*100);$('words').textContent='Rupees '+spell(rupees)+(paise?' and '+spell(paise)+' Paise':'')+' Only.'}
function addItem(description='',unit='SFT',qty='',rate=''){const row=document.createElement('tr');row.innerHTML='<td class="serial"></td><td><textarea class="desc" aria-label="Description" rows="3"></textarea></td><td><input class="unit" aria-label="Unit"></td><td><input class="qty" aria-label="Quantity" type="number" min="0" step="any"></td><td><input class="rate" aria-label="Rate" type="number" min="0" step="any"></td><td class="amt">0.00</td><td class="no-print"><button class="line-item-remove" type="button" aria-label="Remove item">×</button></td>';row.querySelector('.desc').value=description;row.querySelector('.unit').value=unit;row.querySelector('.qty').value=qty;row.querySelector('.rate').value=rate;row.addEventListener('input',recalc);row.querySelector('button').addEventListener('click',()=>{row.remove();recalc()});$('items').append(row);recalc()}
$('add').addEventListener('click',()=>addItem());$('print').addEventListener('click',()=>{if(!$('client').value.trim()||!$('scope').value.trim()||!$('items').rows.length||!$('office').value.trim()||!$('contact').value.trim()){alert('Enter client, scope, company contact details and at least one line item before printing.');return}if([...$('items').rows].some(r=>!r.querySelector('.desc').value.trim()||!r.querySelector('.qty').value||!r.querySelector('.rate').value||Number(r.querySelector('.qty').value)<=0||Number(r.querySelector('.rate').value)<0)){alert('Complete description, positive quantity and valid rate for each item.');return}window.print()});addItem();const params=new URLSearchParams(location.search);if(params.has('area')&&params.has('quote')){const area=Number(params.get('area')),quote=Number(params.get('quote'));if(Number.isFinite(area)&&area>0&&Number.isFinite(quote)&&quote>=0){const row=$('items').rows[0];row.querySelector('.desc').value='Painting work — confirm specification and inclusions';row.querySelector('.qty').value=area;row.querySelector('.rate').value=(quote/area).toFixed(2);$('scope').value='Painting work — verify site measurements and application system';recalc()}}
</script></body></html>
